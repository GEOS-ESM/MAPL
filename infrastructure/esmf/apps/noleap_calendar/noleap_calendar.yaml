# Configuration for the noleap_calendar_driver.x standalone executable.
#
# The esmf: section is forwarded to ESMF_Initialize.  Set defaultCalKind
# to any ESMF_CALKIND_* value to select the default calendar for the run.
#
# Common values:
#   ESMF_CALKIND_NOLEAP    – every year has 365 days (no Feb 29)
#   ESMF_CALKIND_GREGORIAN – standard Gregorian calendar (with leap years)
#   ESMF_CALKIND_360DAY    – every month has 30 days
#
#To run test do:
#   mpirun -np 1 noleap_calendar_driver.x noleap_calendar.yaml

esmf:
  defaultCalKind: ESMF_CALKIND_NOLEAP
  logKindFlag: ESMF_LOGKIND_NONE
