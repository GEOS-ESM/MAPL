cap:
  name: cap
  restart: cap_restart.yaml

  clock:
    dt: PT1H
    start: 1891-03-01T00:00:00
    stop: 1891-03-01T02:00:00
    segment_duration: PT2H

  checkpointing:
    enabled: false
    final: false
    path: checkpoints
    alarms: {}

  extdata_name: &extdata EXTDATA
  history_name: &history HIST
  root_name: &root GCM

  run_extdata: true
  run_history: true

  mapl:
    setServices:
      sharedObj: libMAPL.cap
    children:
      *root :
        config_file: GCM.yaml
      *extdata :
        config_file: extdata.yaml
      *history :
        config_file: history.yaml

esmf:
  logKindFlag: ESMF_LOGKIND_MULTI_ON_ERROR
  defaultCalKind: ESMF_CALKIND_GREGORIAN
  logAppendFlag: false

mapl:
  model_petcount: 1
  pet_as_ssi: true
  servers:
    pfio_output_server:
      num_nodes: 1
      sharedObj: libMAPL
      userRoutine: setservices_
