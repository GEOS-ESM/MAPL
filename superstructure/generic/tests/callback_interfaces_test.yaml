# Test-only callback registration file for mapl_CallbackRegistrationLoader_mod
# (superstructure/generic/graph/callback/CallbackRegistrationLoader.F90).
# This file is not installed; it is copied into this ctest working
# directory by superstructure/generic/tests/CMakeLists.txt and read by
# name, not through the default "./callback_interfaces.yaml" lookup
# (mapl_MaplFramework_mod::initialize_callback_registry), so it never
# interferes with tests that exercise the "no registration file found"
# path.
#
# toy_scaling is the worked example other tasks' tests rely on existing
# at this path with exactly this shape (arguments, methods, attributes,
# rules): do not change its shape without checking what depends on it.
#
# A duplicate interface name at the top level of this file (e.g. two
# "toy_scaling:" entries) is a load error naming the file and the
# interface (CallbackRegistrationLoader checks every name in the file
# against every other name before registering anything). A duplicate
# argument/method/attribute/call-scalar name within one interface entry
# is also a load error (CallbackInterface rejects an already-declared
# name). A duplicate *scalar* key within one entry (e.g. a second
# "version:" line) is not detected: the loader reads such a key by
# name, and ESMF_HConfig's keyString lookup silently returns only the
# first occurrence's value, never the last, never an error. Keep every
# key unique within an entry.
toy_scaling:
  version: 1
  summary: toy scaling callback interface
  arguments:
    quantity:
      kind: field
      dims: xyz
    offset_value:
      kind: field
      dims: xy
      optional: true
  methods:
    get:
      quantity: out
      offset_value: out
    put:
      quantity: in
  attributes:
    operation:
      type: string
      scope: state
      required: true
      allowed: [scale, offset]
    factor:
      type: real
      scope: state
      default: 2.0
  rules:
    - when:
        operation: offset
      requires:
        - offset_value
