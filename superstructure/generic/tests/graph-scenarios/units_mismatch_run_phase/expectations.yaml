    comp_src/T: {status: complete, typekind: R4, rank: 2, value: 10.}
    comp_src/T(1): {legacy_only: true, status: complete, typekind: R4, rank: 2, units: 'Pa', value: 1000.}
  graph:
    nodes: 4
    connections:
      - {export: comp_src/T, import: comp_dst/T, chain: [units]}
