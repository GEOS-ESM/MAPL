mapl:
  geometry:
    esmf_geom:
      class: latlon
      im_world: 12
      jm_world: 13
      pole: PC
      dateline: DC

    vertical_grid:
      class: basic
      num_levels: 5

  children:
    comp_src:
      config_file: graph-scenarios/units_mismatch_run_phase/comp_src.yaml
    comp_dst:
      config_file: graph-scenarios/units_mismatch_run_phase/comp_dst.yaml

  states: {}

  setServices:
    sharedObj: libconfigurable_gridcomp

  connections:
    - all_unsatisfied: true
      src_comp: comp_src
      dst_comp: comp_dst
