# comp_src exports 10 hPa (R4); comp_dst imports Pa (R8): units step, then typekind step.
- component: comp_src/<user>
  export:
    T: {status: complete, typekind: R4, rank: 2, value: 10.}

- component: comp_src
  export:
    T: {status: complete, typekind: R4, rank: 2, value: 10.}
    T(1): {status: complete, typekind: R4, rank: 2, value: 1000.}  # hPa --> Pa
    T(2): {status: complete, typekind: R8, rank: 2, value: 1000.}  # r4 --> r8

- component: comp_dst/<user>
  import:
    T: {status: complete, typekind: R8, rank: 2, value: 1000.}

- component: comp_dst
  import:
    T: {status: complete, typekind: R8, rank: 2, value: 1000.}

- component: <user>
  import: {}
  export: {}
  internal: {}

- component: <root>
  export:
    comp_src/T: {status: complete, typekind: R4, rank: 2, value: 10.}
    comp_src/T(1): {status: complete, typekind: R4, rank: 2, value: 1000.}
    comp_src/T(2): {status: complete, typekind: R8, rank: 2, value: 1000.}
