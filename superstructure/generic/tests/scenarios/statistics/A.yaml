mapl:
  # 'air_temperature' (not the previous, capitalized 'Temperature' - not a
  # valid CF standard name) is backed by field_dictionary_test.yaml's
  # already-existing air_temperature entry (also used by Test_Aspects.pf,
  # Test_VectorBasisKind.pf, Test_FieldDictIntegration.pf) - see openspec
  # change use-field-dictionary-in-scenario-tests. long_name is supplied by
  # the dictionary rather than declared here.
  states:
    import: {}
    export:
      T:
        standard_name: 'air_temperature'
        units: 'K'
        vertical_dim_spec: NONE

  setServices:
    sharedObj: libconfigurable_gridcomp
