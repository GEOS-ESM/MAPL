mapl:
  setServices:
    sharedObj: libMAPL.statistics

# anchors for recurring cases
monthly: &monthly
  period: P1M
  ref_datetime: 'YYYY-MM-01T00:00:00' # + 2000-01-01T00:00:00

daily: &daily
  period: PT24H
  ref_datetime: 'YYYY-MM-DDT21:00:00' # + 2000-01-01T00:00:00

hourly: &hourly
  period: P1H
  ref_datetime: 'YYYY-MM-DDT03:00:00' # + 2000-01-01T00:00:00

monthly_average: &monthly_average
  action: average
  <<: *monthly

monthly_variance: &monthly_variance
  action: variance
  <<: *monthly

monthly_covariance: &monthly_covariance
  action: variance
  <<: *monthly

daily_min: &daily_min
  action: min
  <<: *daily

daily_max: &daily_max
  action: max
  <<: *daily

stats:
  - name: A/TS
    action: average
    itemtype: field
    <<: *daily
  - name: A/PS
    action: max
    itemtype: field
    <<: *daily
  - name: A/QV_MIN
    action: min
    itemtype: field
    <<: *daily
  - name: A/SLP_ACCUM
    action: accumulate
    itemtype: field
    <<: *daily
  - name: A/UV
    action: average
    itemtype: vector
    <<: *daily
  - name: A/UV_MIN
    action: min
    itemtype: vector
    <<: *daily
  - name: A/UV_MAX
    action: max
    itemtype: vector
    <<: *daily
  - name: A/UV_ACCUM
    action: accumulate
    itemtype: vector
    <<: *daily
  - name: A/TS_VAR_W
    action: variance
    algorithm: welford
    itemtype: field
    <<: *daily
  - name: A/TS_VAR_S
    action: variance
    algorithm: shifted
    itemtype: field
    <<: *daily
  - name: A/UV_VAR_W
    action: variance
    algorithm: welford
    itemtype: vector
    <<: *daily
  - name: A/UV_VAR_S
    action: variance
    algorithm: shifted
    itemtype: vector
    <<: *daily
  - name: A/TS_VAR_W_BIASED
    action: variance
    algorithm: welford
    biased: true
    itemtype: field
    <<: *daily
  - name: A/TS_VAR_S_BIASED
    action: variance
    algorithm: shifted
    biased: true
    itemtype: field
    <<: *daily
  - name: A/UV_VAR_W_BIASED
    action: variance
    algorithm: welford
    biased: true
    itemtype: vector
    <<: *daily
  - name: A/UV_VAR_S_BIASED
    action: variance
    algorithm: shifted
    biased: true
    itemtype: vector
    <<: *daily
