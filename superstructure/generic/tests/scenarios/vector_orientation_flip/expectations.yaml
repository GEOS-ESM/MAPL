# Same vertical grid, vector export stored downward and import stored upward:
# one orientation step (VerticalFlipTransform on the bundle). The members of
# a vector cannot be given a non-constant profile by the test components, so
# the values are constant: they show the step ran and filled the members; the
# member order itself is checked by Test_VerticalColumnRegridTransform.pf
# (test_flip_bundle). The table entry sets graph_owns_user_states so that in
# GRAPH mode the import is the graph's.

- component: A
  export:
    uv:
      status: complete
      class: bundle
      standard_name: ['eastward horizontal velocity', 'northward horizontal velocity']

- component: B
  import:
    uv:
      status: complete
      class: bundle
      value: [1., 1.]
      standard_name: ['eastward horizontal velocity', 'northward horizontal velocity']

- component: <root>
  graph:
    connections:
      - {export: A/uv, import: B/uv, chain: [orientation]}
