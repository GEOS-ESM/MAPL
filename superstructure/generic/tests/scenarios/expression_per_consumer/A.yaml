mapl:
  states:
    export:
      A:
        standard_name: A
        units: m
        typekind: R4
        fill_value: 1
        vertical_dim_spec: NONE
      B:
        standard_name: B
        units: m
        typekind: R4
        fill_value: 2
        vertical_dim_spec: NONE
      C:
        standard_name: C
        units: m
        typekind: R4
        fill_value: 3
        vertical_dim_spec: NONE
      expr:
        expression: (A + B)/C
        standard_name: 'expr standard name'
        units: m
        vertical_dim_spec: NONE

  setServices:
    sharedObj: libconfigurable_gridcomp
