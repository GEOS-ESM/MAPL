      config_file: scenarios/expression_per_consumer/A.yaml
    B:
      config_file: scenarios/expression_per_consumer/B.yaml
    C:
      config_file: scenarios/expression_per_consumer/C.yaml

  states: {}

  setServices:
    sharedObj: libconfigurable_gridcomp

  connections:
