- component: A/<user>
  export:
    A: {status: complete, value=1.}
    B: {status: complete, value=2.}
- component: A
  export:
    A: {status: complete}
    B: {status: complete}
    A(1): {legacy_only: true, status: complete, value: 1., tolerance: 1.e-6}
    B(1): {legacy_only: true, status: complete, value: 2., tolerance: 1.e-6}
    expr(2): {legacy_only: true, status: complete, value: 3., tolerance: 1.e-6}
    expr(4): {legacy_only: true, status: complete, value: 3., tolerance: 1.e-6}

- component: B/<user>
  import:
    I: {status: complete, value: 3., tolerance: 1.e-6}  # A=1, B=2, A+B=3
- component: B
  import:
    I: {status: complete}
- component: C/<user>
  import:
    I: {status: complete, value: 3., tolerance: 1.e-6}  # A=1, B=2, A+B=3
- component: C
  import:
    I: {status: complete}
- component: <user>
  import: {}
  export: {}
  internal: {}
- component: <root>
  export:
    A/expr(2): {legacy_only: true, status: complete}
    A/A: {status: complete}
    A/B: {status: complete}
  graph:
    connections:
      - export: A/expr
        import: B/I
        expression: true
        inputs: {A: [geometry], B: [geometry]}
        chain: []
      - export: A/expr
        import: C/I
        expression: true
        inputs: {A: [geometry], B: [geometry]}
        chain: []
