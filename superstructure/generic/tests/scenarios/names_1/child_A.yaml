mapl:
  states:
    import:
      I_A1:
        standard_name: 'I_A1 standard name'
        long_name: 'I_A1 long name'
        units: 'm'
        vertical_dim_spec: NONE

    export:
      E_A1:
        standard_name: 'E_A1 standard name'
        long_name: 'E_A1 long name'
        units: 'm'
        fill_value: 1
        vertical_dim_spec: NONE
      # E_A2 declares a name, but its connected import (I_B2) does not -
      # exercises predecessor inheritance (spec requirement "Unassigned
      # metadata is inherited from the connection predecessor").
      E_A2:
        standard_name: 'E_A2 standard name'
        long_name: 'E_A2 long name'
        units: 'm'
        fill_value: 1
        vertical_dim_spec: NONE
      # E_A3 declares a name and connects to an import (I_B3) with a
      # mismatched typekind, forcing an intermediate typekind-conversion
      # coupler.  Exercises "Name propagates through an intermediate
      # transform".
      E_A3:
        standard_name: 'E_A3 standard name'
        long_name: 'E_A3 long name'
        units: 'm'
        typekind: R8
        fill_value: 1
        vertical_dim_spec: NONE

  setServices:
    sharedObj: libconfigurable_gridcomp
