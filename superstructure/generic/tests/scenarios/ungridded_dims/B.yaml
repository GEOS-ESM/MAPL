mapl:
  states:

    export:
      E_B2:
        standard_name: 'B2 standard name'
        units: 'm'
        typekind: R4
        fill_value: 5.
        vertical_dim_spec: NONE
        ungridded_dims:
          - {dim_name: foo1, extent: 3}
          - {dim_name: foo2, extent: 2}

    import:
      # I_B1 standard_name changed to match its connected Export (A's
      # E_A1) - previously declared its own independent placeholder,
      # which disagrees under STRICT ValidationMode.
      I_B1:
        standard_name: 'A1 standard name'
        units: 'm'
        typekind: R4
        fill_value: 2. # expected to change
        vertical_dim_spec: NONE
        ungridded_dims:
          - {dim_name: foo1, extent: 3}

  setServices:
    sharedObj: libconfigurable_gridcomp
