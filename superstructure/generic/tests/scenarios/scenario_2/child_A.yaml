mapl:
  # I_A1/E_A1/Z_A1's standard_name/units/long_name are backed by
  # field_dictionary_test.yaml (units 'm', long_name '<name> long name') -
  # see openspec change use-field-dictionary-in-scenario-tests. units are
  # unified to 'm' here (previously an arbitrary, non-connection-tested mix
  # of 'meter'/'barn'/'1') for consistency with the same names used
  # identically across scenario_1/propagate_geom/memory_checkpoint/names_1.
  states:
    import:
      I_A1:
        standard_name: 'I_A1 standard name'
        units: 'm'
        vertical_dim_spec: NONE

    export:
      E_A1:
        standard_name: 'E_A1 standard name'
        units: 'm'
        fill_value: 1
        vertical_dim_spec: NONE

    internal:
      Z_A1:
        standard_name: 'Z_A1 standard name'
        units: 'm'
        fill_value: 1
        vertical_dim_spec: NONE

  connections:
    - src_name: Z_A1
      src_comp: <self>
      src_intent: internal
      dst_name: ZZ_A1
      dst_comp: <self>
      dst_intent: export

  setServices:
    sharedObj: libconfigurable_gridcomp
