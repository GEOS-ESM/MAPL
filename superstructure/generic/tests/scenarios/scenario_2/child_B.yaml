mapl:
  # See child_A.yaml - I_B1/E_B1/Z_B1 use the field_dictionary_test.yaml-backed
  # 'm' convention shared across this scenario family.
  states:
    import:
      I_B1:
        standard_name: 'E_A1 standard name'
        units: 'm'
        vertical_dim_spec: NONE

    export:
      E_B1:
        standard_name: 'E_B1 standard name'
        units: 'm'
        fill_value: 1
        vertical_dim_spec: NONE

    internal:
      Z_B1:
        standard_name: 'Z_B1 standard name'
        units: 'm'
        vertical_dim_spec: NONE

  setServices:
    sharedObj: libconfigurable_gridcomp
