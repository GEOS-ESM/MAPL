# For each component:
#   - provide a path to the outer/user componen in the hierarchy
#   - list the fields expected in each import/export/internal states
#   - annotate whether field is "complete"

- component: child_A/<user>
  import:
    I_A1: {status: gridset}
  export:
    E_A1: {status: complete, long_name: 'E_A1 long name'}
    Z_A1: {status: complete, long_name: 'Z_A1 long name'}
  internal:
    Z_A1: {status: complete, long_name: 'Z_A1 long name'}
- component: child_A
  import:
    I_A1: {status: gridset}
  export:
    E_A1: {status: complete, long_name: 'E_A1 long name'}
    Z_A1: {status: complete, long_name: 'Z_A1 long name'}

- component: child_B/<user>
  import:
    I_B1: {status: complete, long_name: 'E_A1 long name'}
  export:
    E_B1: {status: gridset}
  internal:
    Z_B1: {status: complete, long_name: 'Z_B1 long name'}
- component: child_B
  import:
    I_B1: {status: complete, long_name: 'E_A1 long name'}
  export:
    E_B1: {status: gridset}
- component: <user>
  import: {}
  export: {}
  internal: {}
- component: <root>
  import:
    I_A1(1): {status: gridset}   # unsatisfied
  export:
    child_A/E_A1: {status: complete, long_name: 'E_A1 long name'}
    child_A/Z_A1: {status: complete, long_name: 'Z_A1 long name'}  # re-export
    child_B/E_B1: {status: gridset}   # re-export
