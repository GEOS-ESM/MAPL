mapl:
  # I_B1/E_B1/Z_B1's long_name is supplied by field_dictionary_test.yaml
  # (not declared here) - see openspec change use-field-dictionary-in-scenario-tests.
  states:
    import:
      I_B1:
        standard_name: 'E_A1 standard name'
        units: 'm'
        vertical_dim_spec: NONE

    export:
      E_B1:
        standard_name: 'E_B1 standard name'
        units: 'm'
        fill_value: 1
        vertical_dim_spec: NONE

    internal:
      Z_B1:
        standard_name: 'Z_B1 standard name'
        units: 'm'
        vertical_dim_spec: NONE

  setServices:
    sharedObj: libconfigurable_gridcomp
