mapl:

  geometry:
    esmf_geom:
      class: latlon
      im_world: 12
      jm_world: 13
      pole: PC
      dateline: DC
    vertical_grid:
      class: fixed_levels
      levels: [25., 15.]
      units: hPa
      physical_dimension: pressure

  states:
    import:
      uv:
        class: vector
        standard_name: '(eastward,northward) horizontal velocity'
        units: 'm s-1'
        fill_value: 1
        vertical_dim_spec: center
    export: {}

  setServices:
    sharedObj: libconfigurable_gridcomp
