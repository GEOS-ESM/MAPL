mapl:

  geometry:
    esmf_geom:
      class: latlon
      im_world: 12
      jm_world: 13
      pole: PC
      dateline: DC
    vertical_grid:
      grid_type: model
      fields: {height: ZLE}
      num_levels: 4

  # 'height' is backed by field_dictionary_test.yaml (units m) - see
  # openspec change use-field-dictionary-in-scenario-tests.
  states:
    import: {}
    export:
      ZLE:
        standard_name: height
        units: m
        fill_value: 23.
        vertical_dim_spec: edge

  setServices:
    sharedObj: libconfigurable_gridcomp
