mapl:
  states:
    import:
      # standard_name changed to match its connected Export's declared
      # value (expr's 'expr standard name') - previously declared its own
      # independent placeholder 'I', deliberately disagreeing to exercise
      # PERMISSIVE-mode-specific override behavior. Per user direction,
      # that behavior is no longer considered worth preserving as a
      # dedicated scenario; the observed standard_name here was already
      # 'expr standard name' either way (the Export's value always wins),
      # so expectations.yaml is unchanged.
      I:
        standard_name: 'expr standard name'
        long_name: 'I long name'
        units: m
        vertical_dim_spec: NONE
      # I2 declares no standard_name/long_name of its own - expected to
      # inherit expr2's declared name (predecessor propagation) rather than
      # being silently discarded (generic/field-name-propagation).
      I2:
        units: m
        vertical_dim_spec: NONE

    export: {}

    internal: {}

  setServices:
    sharedObj: libconfigurable_gridcomp
