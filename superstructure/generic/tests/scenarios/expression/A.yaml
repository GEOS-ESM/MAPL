mapl:
  states:
    import: {}
    export:
      A:
        standard_name: A
        units: 'm'
        fill_value: 1
        vertical_dim_spec: NONE
      B:
        standard_name: B
        units: 'm'
        fill_value: 2
        vertical_dim_spec: NONE
      C:
        standard_name: C
        units: 'm'
        fill_value: 3
        vertical_dim_spec: NONE
      expr:
        expression: (A + B)/C
        units: m
        vertical_dim_spec: NONE
        standard_name: 'expr standard name'
        long_name: 'expr long name'
      # Same computation, connected to an import (I2 in B) that declares no
      # standard_name/long_name of its own - exercises inheriting the
      # exporter's declared name (generic/field-name-propagation).
      expr2:
        expression: (A + B)/C
        units: m
        vertical_dim_spec: NONE
        standard_name: 'expr2 standard name'
        long_name: 'expr2 long name'


    internal: {}

  setServices:
    sharedObj: libconfigurable_gridcomp
