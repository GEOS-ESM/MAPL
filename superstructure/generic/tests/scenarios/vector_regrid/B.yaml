mapl:

  geometry:
    esmf_geom:
      class: latlon
      im_world: 6
      jm_world: 7
      pole: PC
      dateline: DC

    vertical_grid:
      class: basic
      num_levels: 5

  states:
    import:
      uv:
        class: vector
        standard_name: '(eastward,northward) horizontal velocity'
        units: 'm s-1'
        fill_value: 1
        vertical_dim_spec: NONE
      wind:
        class: vector
        standard_name: '(eastward,northward) wind'
        units: 'km s-1'
        fill_value: 1
        vertical_dim_spec: NONE
    export: {}

  setServices:
    sharedObj: libconfigurable_gridcomp
