esmf:
  logKindFlag: ESMF_LOGKIND_MULTI
  logAppendFlag: false


mapl:
  app_petcount: 1
  pflogger_cfg_file: logging.yaml
#  servers:
#    pfio:
#       nodes: 1
#    mit:
#       nodes: 0

cap:
  name: cap
  skip_restart_write: true
  restart: cap_restart4.yaml

  clock:
    dt: PT3H
    start: 2004-10-20T00:00:00
    stop: 2999-03-02T21:00:00
    segment_duration: P1D

  extdata_name: EXTDATA
  history_name: HIST
  root_name: GCM
  run_extdata: true
  run_history: true

  mapl:
    setServices:
      sharedObj: libMAPL.cap
    children:
      GCM:
        config_file: GCM4.yaml
      EXTDATA:
        config_file: extdata4.yaml
      HIST:
        config_file: history4.yaml
