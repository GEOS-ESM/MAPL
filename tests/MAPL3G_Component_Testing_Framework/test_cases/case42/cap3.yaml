esmf:
  logKindFlag: ESMF_LOGKIND_MULTI
  logAppendFlag: false


mapl:
  app_petcount: 1
  pflogger_cfg_file: logging.yaml
#  servers:
#    pfio:
#       nodes: 1
#    mit:
#       nodes: 0

cap:
  name: cap
  skip_restart_write: true
  restart: cap_restart3.yaml

  checkpointing:
     enabled: true
     final: true
     path: checkpoints
     alarms: {}

  clock:
    dt: PT24H
    start: 2004-12-01T00:00:00
    stop: 2999-03-02T21:00:00
    segment_duration: P192D

  extdata_name: EXTDATA
  history_name: HIST
  root_name: GCM
  run_extdata: true
  run_history: true

  mapl:
    setServices:
      sharedObj: libMAPL.cap
    children:
      GCM:
        config_file: GCM3.yaml
      EXTDATA:
        config_file: extdata3.yaml
      HIST:
        config_file: history3.yaml
