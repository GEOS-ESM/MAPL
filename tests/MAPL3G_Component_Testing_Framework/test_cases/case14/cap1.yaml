esmf:
  logKindFlag: ESMF_LOGKIND_MULTI
  logAppendFlag: false


mapl:
  model_petcount: 1
  pflogger_cfg_file: logging.yaml

cap:
  name: cap
  restart: cap_restart1.yaml
  skip_restart_write: True

  clock:
    dt: PT24H
    start: 2007-01-01T00:00:00
    stop: 2999-03-02T00:00:00
    segment_duration: P365D

  extdata_name: EXTDATA
  history_name: HIST
  root_name: GCM
  run_extdata: true
  run_history: true

  mapl:
    setServices:
      sharedObj: libMAPL.cap
    children:
      GCM:
        config_file: GCM1.yaml
      EXTDATA:
        config_file: extdata1.yaml
      HIST:
        config_file: history1.yaml
