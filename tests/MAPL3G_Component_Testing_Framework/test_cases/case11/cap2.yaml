esmf:
  logKindFlag: ESMF_LOGKIND_MULTI
  logAppendFlag: false


mapl:
  app_petcount: 1
  pflogger_cfg_file: logging.yaml
#  servers:
#    pfio:
#       nodes: 1
#    mit:
#       nodes: 0

cap:
  name: cap
  skip_restart_write: true
  restart: cap_restart2.yaml

  clock:
    dt: PT3H
    start: 2005-02-01T00:00:00
    stop: 2999-03-02T21:00:00
    segment_duration: P30D

  extdata_name: EXTDATA
  history_name: HIST
  root_name: GCM
  run_extdata: true
  run_history: true

  run_times:
    - '2005-02-25T21:00:00'

  mapl:
    setServices:
      sharedObj: libMAPL.cap
    children:
      GCM:
        config_file: GCM2.yaml
      EXTDATA:
        config_file: extdata2.yaml
      HIST:
        config_file: history2.yaml
